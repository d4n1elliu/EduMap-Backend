name: .NET Backend CI/CD
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find latest Frontend Build on main
        id: frontend
        env:
          GH_TOKEN: ${{ secrets.MY_GITHUB_PAT }}
        run: |
          run=$(gh run list -R d4n1elliu/EduMap -w frontend-deploy.yml -b main -s success -L 1 \
            --json databaseId,headSha,createdAt --jq '.[0]')
          if [ -z "$run" ] || [ "$run" = "null" ]; then
            echo "No successful Frontend Build run found on main"
            exit 1
          fi
          echo "Frontend Build run $(jq -r .databaseId <<< "$run"), commit $(jq -r .headSha <<< "$run"), built $(jq -r .createdAt <<< "$run")"
          echo "run_id=$(jq -r .databaseId <<< "$run")" >> "$GITHUB_OUTPUT"

      - name: Clear wwwroot
        run: rm -rf ./wwwroot

      - name: Download Frontend Artifacts
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.MY_GITHUB_PAT }}
          repo: d4n1elliu/EduMap
          run_id: ${{ steps.frontend.outputs.run_id }}
          name: frontend-dist
          path: ./wwwroot

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x' # Matches your project settings

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Publish
        run: dotnet publish -c Release -o ./publish

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'EduMap'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
          clean: true